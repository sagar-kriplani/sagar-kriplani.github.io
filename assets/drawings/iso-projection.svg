<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40" aria-label="First Angle Projection Symbol (DIN ISO 128-30)" role="img">
  <title>First Angle Projection Symbol (DIN ISO 128-30)</title>
  <!-- Centerlines -->
  <line x1="2" y1="20" x2="98" y2="20" stroke="currentColor" stroke-width="0.75" stroke-dasharray="8,3,2,3" opacity="0.6"/>
  <line x1="78" y1="2" x2="78" y2="38" stroke="currentColor" stroke-width="0.75" stroke-dasharray="8,3,2,3" opacity="0.6"/>
  
  <!-- Truncated cone (Frustum) -->
  <polygon points="12,12 12,28 42,34 42,6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Concentric circles -->
  <circle cx="78" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="78" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
</svg>
