<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" class="tech-drawing-svg" aria-label="Isometric Exploded Drawing of High-Vacuum Chamber and FOUP Semiconductor Interface" role="img">
  <title>Isometric Exploded Assembly — High-Vacuum Chamber &amp; FOUP 300mm Pod Cleanroom Interface</title>
  <defs>
    <!-- 45-degree engineering cross-section hatch -->
    <pattern id="sectionHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <!-- Micro grid pattern for technical canvas backdrop -->
    <pattern id="isoCanvasGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <!-- Dimension arrow markers -->
    <marker id="dimArrowStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="var(--color-accent, #E8590C)"/>
    </marker>
    <marker id="dimArrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="var(--color-accent, #E8590C)"/>
    </marker>
  </defs>

  <style>
    .draw-line { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-main { stroke-width: 1.25px; }
    .stroke-thin { stroke-width: 0.8px; }
    .stroke-hidden { stroke-dasharray: 4,3; stroke-width: 0.7px; opacity: 0.5; }
    .stroke-center { stroke-dasharray: 14,4,3,4; stroke-width: 0.75px; opacity: 0.65; stroke: var(--color-ink-muted, #486581); }
    .stroke-dim { stroke: var(--color-accent, #E8590C); stroke-width: 1px; }
    .text-dim { font-family: 'Geist Mono', 'IBM Plex Mono', monospace; font-size: 10px; fill: var(--color-accent, #E8590C); font-weight: 500; }
    .text-tag { font-family: 'Geist Mono', 'IBM Plex Mono', monospace; font-size: 9px; fill: currentColor; opacity: 0.75; }
    .cut-face { fill: url(#sectionHatch); stroke: currentColor; stroke-width: 1.2px; }
  </style>

  <!-- Canvas framing & coordinates -->
  <rect x="15" y="15" width="870" height="590" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.25"/>
  <rect x="20" y="20" width="860" height="580" fill="url(#isoCanvasGrid)" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>

  <!-- Technical Drawing Header in Corner -->
  <g transform="translate(35, 45)">
    <text x="0" y="0" class="text-tag" font-size="11" font-weight="700" letter-spacing="1.5">FIG. 1: EXPLODED ISOMETRIC VIEW (SEMI S2 / S8)</text>
    <text x="0" y="16" class="text-tag" font-size="9" letter-spacing="1">SYSTEM: VACUUM PROCESS CHAMBER &amp; FOUP 300mm LOAD-PORT</text>
    <text x="0" y="30" class="text-tag" font-size="8.5" opacity="0.5">SCALE 1:2.5 · ALL TOLERANCES PER DIN EN ISO 1101 · CLEANROOM CL. 1</text>
  </g>

  <!-- ==================== CHAMBER CENTERLINES ==================== -->
  <g class="stroke-center">
    <!-- Main vertical axis -->
    <line x1="310" y1="60" x2="310" y2="520"/>
    <!-- Transverse horizontal axes -->
    <line x1="120" y1="210" x2="500" y2="210"/>
    <line x1="120" y1="380" x2="500" y2="380"/>
    <!-- FOUP axis -->
    <line x1="660" y1="120" x2="660" y2="520"/>
    <line x1="490" y1="360" x2="830" y2="360"/>
  </g>

  <!-- ==================== SUB-ASSEMBLY 1: EXPLODED TOP FLANGE & VIEWPORT ==================== -->
  <g transform="translate(0, -35)">
    <!-- Top Flange Ring (ISO-K/CF Standard) -->
    <ellipse cx="310" cy="140" rx="140" ry="46" class="draw-line stroke-main"/>
    <ellipse cx="310" cy="148" rx="140" ry="46" class="draw-line stroke-main"/>
    <line x1="170" y1="140" x2="170" y2="148" class="draw-line stroke-main"/>
    <line x1="450" y1="140" x2="450" y2="148" class="draw-line stroke-main"/>
    
    <!-- Bolt Hole Circle (16x M10 tapped holes) -->
    <ellipse cx="310" cy="140" rx="124" ry="40" class="draw-line stroke-hidden"/>
    <!-- Sample bolt holes -->
    <circle cx="186" cy="140" r="3" class="draw-line stroke-thin"/>
    <circle cx="434" cy="140" r="3" class="draw-line stroke-thin"/>
    <circle cx="310" cy="100" r="3" class="draw-line stroke-thin"/>
    <circle cx="310" cy="180" r="3" class="draw-line stroke-thin"/>
    <circle cx="222" cy="112" r="3" class="draw-line stroke-thin"/>
    <circle cx="398" cy="112" r="3" class="draw-line stroke-thin"/>
    <circle cx="222" cy="168" r="3" class="draw-line stroke-thin"/>
    <circle cx="398" cy="168" r="3" class="draw-line stroke-thin"/>

    <!-- Inner viewport quartz glass aperture -->
    <ellipse cx="310" cy="140" rx="80" ry="26" class="draw-line stroke-main cut-face"/>
    <ellipse cx="310" cy="140" rx="60" ry="20" class="draw-line stroke-thin"/>
    <!-- Optical reflection indicator -->
    <path d="M 270 134 L 340 144" class="draw-line stroke-thin" opacity="0.4"/>
    <path d="M 280 132 L 350 142" class="draw-line stroke-thin" opacity="0.4"/>

    <!-- Exploded alignment transfer vectors -->
    <path d="M 170 148 L 170 190" class="draw-line stroke-dim" stroke-dasharray="3,3"/>
    <path d="M 450 148 L 450 190" class="draw-line stroke-dim" stroke-dasharray="3,3"/>
  </g>

  <!-- ==================== SUB-ASSEMBLY 2: FKM / VITON O-RING SEAL ==================== -->
  <g transform="translate(0, -10)">
    <ellipse cx="310" cy="185" rx="105" ry="34" class="draw-line stroke-main" stroke="var(--color-accent, #E8590C)" stroke-width="2.5"/>
    <path d="M 310 185 L 230 185" class="draw-line stroke-dim" marker-start="url(#dimArrowStart)"/>
    <text x="140" y="188" class="text-dim">ELASTOMER O-RING (FKM)</text>
  </g>

  <!-- ==================== SUB-ASSEMBLY 3: VACUUM VESSEL (CUTAWAY VIEW) ==================== -->
  <g>
    <!-- Chamber Top Upper Rim -->
    <ellipse cx="310" cy="220" rx="140" ry="46" class="draw-line stroke-main"/>
    <ellipse cx="310" cy="226" rx="140" ry="46" class="draw-line stroke-thin"/>

    <!-- Outer Cylindrical Shell (Stainless Steel 316Ti) -->
    <!-- Left outer profile -->
    <path d="M 170 226 L 170 420 A 140 46 0 0 0 450 420 L 450 226" class="draw-line stroke-main"/>
    
    <!-- Chamber Bottom Ellipse -->
    <ellipse cx="310" cy="420" rx="140" ry="46" class="draw-line stroke-main"/>

    <!-- Cutaway Front Quarter (Showing Interior Mechanics & Thermal Chuck) -->
    <!-- Cut plane X-axis (left side cut) -->
    <polygon points="310,220 310,380 450,420 450,226" class="cut-face"/>
    
    <!-- Internal Wafer Thermal Chuck (Brooks EUV / FOUP Module) -->
    <!-- Pedestal shaft -->
    <path d="M 296 350 L 296 420 L 324 420 L 324 350 Z" class="draw-line stroke-main" fill="var(--color-paper-card, #FFFFFF)"/>
    <!-- Heating chuck platen -->
    <ellipse cx="310" cy="340" rx="75" ry="24" class="draw-line stroke-main" fill="var(--color-paper, #F6F4EE)"/>
    <ellipse cx="310" cy="345" rx="75" ry="24" class="draw-line stroke-main"/>
    <!-- 300mm Silicon Wafer on top of platen -->
    <ellipse cx="310" cy="336" rx="66" ry="21" class="draw-line stroke-thin" stroke="var(--color-accent, #E8590C)"/>
    <ellipse cx="310" cy="338" rx="66" ry="21" class="draw-line stroke-thin" stroke="var(--color-accent, #E8590C)"/>
    <path d="M 376 336 A 66 21 0 0 1 370 342" class="draw-line stroke-thin" stroke="var(--color-accent, #E8590C)"/> <!-- Wafer notch -->

    <!-- Radiant IR Heater Matrix Indicator -->
    <g class="draw-line stroke-thin" opacity="0.6">
      <path d="M 260 280 C 275 275, 345 275, 360 280"/>
      <path d="M 255 292 C 275 287, 345 287, 365 292"/>
      <path d="M 250 304 C 275 299, 345 299, 370 304"/>
    </g>

    <!-- Pumping Port Side Flange (CF-100 Differential Vacuum Line) -->
    <g transform="translate(170, 320)">
      <!-- Projection of lateral tube -->
      <path d="M 0 0 L -60 -15 L -60 25 L 0 40 Z" class="draw-line stroke-main" fill="var(--color-paper, #F6F4EE)"/>
      <ellipse cx="-60" cy="5" rx="14" ry="20" class="draw-line stroke-main cut-face"/>
      <line x1="0" y1="20" x2="-80" y2="20" class="stroke-center"/>
      <!-- Label callout -->
      <polyline points="-60,5 -95,-15 -140,-15" class="draw-line stroke-dim"/>
      <text x="-140" y="-20" class="text-dim" text-anchor="end">NW100 CF DIFFERENTIAL PORT</text>
      <text x="-140" y="-8" class="text-tag" text-anchor="end">p &lt; 50 mbar (ΔP -90%)</text>
    </g>
  </g>

  <!-- ==================== SUB-ASSEMBLY 4: FOUP 300MM SEMICONDUCTOR POD ==================== -->
  <g transform="translate(540, 210)">
    <!-- Main Shell Housing (SEMI E47.1 Front-Opening Pod) -->
    <!-- Front Face (Open cleanroom door profile) -->
    <path d="M 30 50 L 170 10 L 230 45 L 230 195 L 170 235 L 30 190 Z" class="draw-line stroke-main" fill="var(--color-paper-card, #FFFFFF)"/>
    
    <!-- Top Chamfers / Robotic Handling Flange (SEMI E15.1) -->
    <polygon points="120,25 170,10 185,18 135,33" class="draw-line stroke-main cut-face"/>
    <path d="M 140 18 L 165 10 L 165 3 L 140 11 Z" class="draw-line stroke-main"/>

    <!-- Cassette internal shelves (300mm wafer slots) -->
    <g class="draw-line stroke-thin" opacity="0.65">
      <line x1="60" y1="80" x2="160" y2="45"/>
      <line x1="60" y1="95" x2="160" y2="60"/>
      <line x1="60" y1="110" x2="160" y2="75"/>
      <line x1="60" y1="125" x2="160" y2="90"/>
      <line x1="60" y1="140" x2="160" y2="105"/>
      <line x1="60" y1="155" x2="160" y2="120"/>
      <line x1="60" y1="170" x2="160" y2="135"/>
    </g>

    <!-- Door latching interface & purge port -->
    <circle cx="50" cy="180" r="5" class="draw-line stroke-thin"/>
    <circle cx="70" cy="185" r="5" class="draw-line stroke-thin"/>
    
    <!-- Kinematic Coupling Pins at base (SEMI E57 Standard) -->
    <polygon points="40,205 50,195 60,205" class="draw-line stroke-main"/>
    <polygon points="150,240 160,230 170,240" class="draw-line stroke-main"/>
    <polygon points="210,205 220,195 230,205" class="draw-line stroke-main"/>

    <!-- Transfer leader line between FOUP and Vacuum Chamber -->
    <path d="M 30 120 C -20 120, -100 180, -164 200" class="draw-line stroke-dim" stroke-dasharray="6,4" marker-end="url(#dimArrowEnd)"/>
    <text x="-60" y="145" class="text-dim">AUTOMATED WAFER TRANSFER (SECS/GEM)</text>
    <text x="130" y="270" class="text-dim" text-anchor="middle">FOUP 300mm (SEMI E47.1)</text>
  </g>

  <!-- ==================== ENGINEERING DIMENSION LINES & GD&T STAMPS ==================== -->
  <!-- Dimension: Overall chamber height -->
  <g transform="translate(100, 0)">
    <line x1="30" y1="185" x2="30" y2="420" class="draw-line stroke-dim" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
    <line x1="20" y1="185" x2="50" y2="185" class="draw-line stroke-thin" opacity="0.5"/>
    <line x1="20" y1="420" x2="50" y2="420" class="draw-line stroke-thin" opacity="0.5"/>
    <text x="20" y="305" class="text-dim" text-anchor="middle" transform="rotate(-90 20 305)">H = 480 mm ±0.1</text>
  </g>

  <!-- Dimension: Chamber Diameter -->
  <g transform="translate(0, 480)">
    <line x1="170" y1="15" x2="450" y2="15" class="draw-line stroke-dim" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
    <line x1="170" y1="0" x2="170" y2="25" class="draw-line stroke-thin" opacity="0.5"/>
    <line x1="450" y1="0" x2="450" y2="25" class="draw-line stroke-thin" opacity="0.5"/>
    <text x="310" y="32" class="text-dim" text-anchor="middle">⌀ 280 mm ID (HV ISO-K)</text>
  </g>

  <!-- GD&T Feature Control Frame Stamp Callout -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="180" height="28" fill="var(--color-paper-card, #FFFFFF)" stroke="currentColor" stroke-width="1.2"/>
    <line x1="35" y1="0" x2="35" y2="28" stroke="currentColor" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="28" stroke="currentColor" stroke-width="1"/>
    <line x1="145" y1="0" x2="145" y2="28" stroke="currentColor" stroke-width="1"/>
    
    <!-- Flatness symbol & tolerance -->
    <path d="M 12 18 L 24 10" stroke="currentColor" stroke-width="1.2"/>
    <path d="M 12 18 L 24 18" stroke="currentColor" stroke-width="1.2"/>
    <text x="18" y="16" class="text-tag" font-size="11" font-weight="700" text-anchor="middle">⏥</text>
    <text x="72" y="18" class="text-dim" font-size="11" text-anchor="middle">0.02</text>
    <text x="127" y="18" class="text-dim" font-size="11" text-anchor="middle">A</text>
    <text x="162" y="18" class="text-dim" font-size="11" text-anchor="middle">B</text>
    
    <!-- Leader line to sealing face -->
    <polyline points="0,14 -40,14 -170,185" class="draw-line stroke-dim"/>
    <circle cx="-170" cy="185" r="2.5" fill="var(--color-accent, #E8590C)"/>
    <text x="-40" y="8" class="text-dim" font-size="8.5">VACUUM SEAL FACE FLANGE</text>
  </g>

  <!-- Datum Marker [A] -->
  <g transform="translate(170, 465)">
    <rect x="-10" y="0" width="20" height="20" fill="var(--color-paper-card, #FFFFFF)" stroke="currentColor" stroke-width="1.2"/>
    <text x="0" y="15" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="currentColor" text-anchor="middle">A</text>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="currentColor" stroke-width="1"/>
    <polygon points="-5,-45 0,-52 5,-45" fill="currentColor"/>
  </g>
</svg>
